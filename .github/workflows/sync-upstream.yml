name: Sync Upstream obra/superpowers

on:
  schedule:
    # Every Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check latest upstream commit
        id: check
        run: |
          CURRENT_SHA=$(python3 -c 'import json; print(json.load(open("upstream.lock"))["commit"])')
          LATEST_SHA=$(git ls-remote https://github.com/obra/superpowers.git refs/heads/main | awk '{print $1}')
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest_sha=${LATEST_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${CURRENT_SHA}" = "${LATEST_SHA}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date at ${CURRENT_SHA}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Update detected: ${CURRENT_SHA} -> ${LATEST_SHA}"
          fi

      - name: Run sync-upstream.py and self-tests
        if: steps.check.outputs.changed == 'true'
        id: sync
        continue-on-error: true
        run: |
          python3 scripts/sync-upstream.py 2>&1 | tee sync.log

      - name: Open PR on clean sync
        if: steps.check.outputs.changed == 'true' && steps.sync.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.check.outputs.latest_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BRANCH="chore/sync-superpowers-${SHORT_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add -A
          if git diff --cached --quiet; then
            echo "No effective changes after vendoring."
            exit 0
          fi
          git commit -m "chore(upstream): sync obra/superpowers to ${SHORT_SHA}"
          git push -u origin "${BRANCH}" --force
          gh pr create \
            --title "chore(upstream): sync obra/superpowers to ${SHORT_SHA}" \
            --body "Automated sync of vendored skills from \`obra/superpowers\` (\`${{ steps.check.outputs.current_sha }}\` -> \`${{ steps.check.outputs.latest_sha }}\`). All patches applied cleanly and \`tests/test-plugin.sh\` passed." \
            --base main \
            --head "${BRANCH}"

      - name: Open issue if patch anchor failed
        if: steps.check.outputs.changed == 'true' && steps.sync.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${{ steps.check.outputs.latest_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          BODY="Upstream \`obra/superpowers\` moved to \`${{ steps.check.outputs.latest_sha }}\`, and automated sync failed (likely a changed anchor in \`custom/patches/patches.json\`).\n\n\`\`\`\n$(tail -n 60 sync.log)\n\`\`\`"
          gh issue create \
            --title "Upstream sync needs manual patch update (${SHORT_SHA})" \
            --body "$(printf '%b' "$BODY")"
          exit 1
